<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Omni">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- The Omni mark (QA t1-accounts-13): an "O" for every channel in one place, with one conversation orbiting it. -->
  <circle cx="30" cy="34" r="15" fill="none" stroke="#ffffff" stroke-width="7"/>
  <circle cx="46.5" cy="17.5" r="5.5" fill="#ffffff"/>
</svg>
